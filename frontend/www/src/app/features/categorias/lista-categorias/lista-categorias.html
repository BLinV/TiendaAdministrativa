<div class="contenedor">
  <h1>Categorías</h1>

  <div class="barra-acciones">
    <button type="button" (click)="nuevaCategoria()">Nueva categoría</button>
  </div>

  @if (cargando()) {
    <p>Cargando...</p>
  }

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (categoria of categorias(); track categoria.id) {
        <tr>
          <td>{{ categoria.nombre }}</td>
          <td>{{ categoria.descripcion }}</td>
          <td class="acciones-celda">
            <button class="btn-secundario" (click)="editar(categoria.id)">Editar</button>
            <button class="btn-peligro" (click)="eliminar(categoria.id)">Eliminar</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No hay categorías.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
