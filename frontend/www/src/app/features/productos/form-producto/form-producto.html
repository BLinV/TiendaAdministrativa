<h1>{{ editando() ? 'Editar' : 'Nuevo' }} producto</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <label>
    Nombre
    <input type="text" formControlName="nombre" />
  </label>

  <label>
    Descripción
    <input type="text" formControlName="descripcion" />
  </label>

  <label>
    Precio
    <input type="number" formControlName="precio" step="0.01" />
  </label>

  <label>
    Stock
    <input type="number" formControlName="stock" />
  </label>

  <label>
    Categoría
    <select formControlName="idCategoria">
      <option [ngValue]="null" disabled>Seleccione...</option>
      @for (cat of categorias(); track cat.id) {
        <option [ngValue]="cat.id">{{ cat.nombre }}</option>
      }
    </select>
  </label>

  <button type="submit" [disabled]="form.invalid">Guardar</button>
  <button type="button" (click)="cancelar()">Cancelar</button>
</form>
