<div class="login-fondo">
  <div class="login-tarjeta">
    <div class="marca">🛍️ Tienda</div>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <input type="text" formControlName="usuario" placeholder="Usuario" />
      <input type="password" formControlName="clave" placeholder="Contraseña" />

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="form.invalid">Iniciar sesión</button>
    </form>
  </div>
</div>
